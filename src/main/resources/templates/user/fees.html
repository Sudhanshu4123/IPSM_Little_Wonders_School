<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Fees - IPSM Little Wonders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --user-primary: #3f51b5;
            --user-bg: #f8f9ff;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--user-bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .user-header {
            background: white;
            padding: 15px 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }
        .fee-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .due-info {
            background: #fff3e0;
            padding: 30px;
            border-radius: 20px;
            border-left: 8px solid #ff9800;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .due-amount h2 {
            margin: 5px 0 0 0;
            color: #e65100;
            font-size: 2.5rem;
        }
        .btn-pay {
            background: #ff9800;
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }
        .table-title {
            font-family: 'Fredoka One', cursive;
            color: var(--user-primary);
            margin-bottom: 20px;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
        }
        .history-table th {
            text-align: left;
            padding: 15px;
            border-bottom: 2px solid #eee;
            color: #666;
        }
        .history-table td {
            padding: 15px;
            border-bottom: 1px solid #f9f9f9;
        }
    </style>
</head>
<body>
    <header class="user-header">
        <a th:href="@{/home}">
            <img th:src="@{/images/ipsm_pre_logo.png}" alt="Logo" style="height: 50px;">
        </a>
        <div style="display: flex; gap: 20px; align-items: center;">
            <a th:href="@{/user/dashboard}" style="text-decoration: none; font-weight: 700; color: var(--user-primary);">Dashboard</a>
            <a th:href="@{/logout}" style="color: #ff5252; text-decoration: none; font-weight: 700; border: 2px solid #ff5252; padding: 8px 15px; border-radius: 10px;">Logout</a>
        </div>
    </header>

    <div class="container">
        <div class="fee-card">
            <h1 class="table-title">My Fee Account</h1>
            
            <div class="due-info">
                <div class="due-amount">
                    <p style="margin: 0; font-weight: 700; color: #666;">Total Pending Dues</p>
                    <h2 th:text="'₹ ' + ${user.pendingFees}">₹ 0.00</h2>
                </div>
                <a href="#" class="btn-pay"><i class="fas fa-credit-card"></i> Pay Now</a>
            </div>

            <h3 style="color: #444; margin-top: 40px;">Payment History</h3>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Ref No</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 40px; color: #999;">No payment history found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
