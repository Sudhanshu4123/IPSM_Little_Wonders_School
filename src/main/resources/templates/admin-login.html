<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - IPSM Little Wonders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #fce4ec 0%, #e1f5fe 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Quicksand', sans-serif;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 3px solid #ff4081; /* Pink border like student login */
        }
        .login-logo {
            width: 100px;
            margin-bottom: 20px;
        }
        .admin-badge {
            background: #ff4081;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 15px;
        }
        h2 {
            color: #b71677;
            margin-bottom: 30px;
            font-family: 'Fredoka One', cursive;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #ff4081;
        }
        .btn-login {
            background: #ff4081;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.3);
        }
        .btn-login:hover {
            background: #e91e63;
            transform: translateY(-2px);
        }
        .error-msg {
            color: #ff5252;
            margin-bottom: 20px;
            background: #ffebee;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        .footer-text {
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }
        .footer-text a {
            color: #ff4081;
            text-decoration: none;
            font-weight: 600;
        }
        .password-wrapper {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #777;
            transition: color 0.3s;
        }
        .toggle-password:hover {
            color: #ff4081;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <a th:href="@{/}">
            <img th:src="@{/images/ipsm_pre_logo.png}" alt="Logo" class="login-logo">
        </a>
        <div class="admin-badge"><i class="fas fa-user-shield"></i> System Admin</div>
        <h2>Admin Access</h2>
        
        <div th:if="${param.error}" class="error-msg">
            <i class="fas fa-exclamation-circle"></i> Invalid admin credentials.
        </div>
        <div th:if="${param.user_not_allowed}" class="error-msg">
            <i class="fas fa-user"></i> Students cannot access the Admin portal.
        </div>

        <form th:action="@{/ipsm-admin/process}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter admin username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>
            <button type="submit" class="btn-login">Verify Identity</button>
        </form>

        <div class="footer-text">
            Restricted Area. <br> 
            <a th:href="@{/}"><i class="fas fa-arrow-left"></i> Back to Website</a>
        </div>
    </div>
    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function (e) {
            // toggle the type attribute
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            // toggle the eye / eye slash icon
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
