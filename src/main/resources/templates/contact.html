<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | IPSM Little Wonders Preschool Goyla Dairy</title>
    <meta name="description"
        content="Contact IPSM Little Wonders Preschool in Goyla Dairy, New Delhi for admission inquiries, school tours, and program details. Visit us today!">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" th:href="@{/images/ipsm_pre_logo.png}" type="image/jpeg">
    <style>
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 50px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
        }

        .contact-info-item {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .contact-info-item i {
            font-size: 1.5rem;
            color: var(--primary);
            background: var(--light);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        @media (max-width: 992px) {
            .contact-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            section {
                padding: 40px 15px !important;
            }

            .contact-form .testimonial-card {
                padding: 25px !important;
            }
        }
    </style>
</head>

<body>
    <div th:replace="~{index :: header}"></div>

    <section class="page-title-section"
        th:style="'background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url(' + @{'/images/contactus_image.jpeg'} + '); background-size: cover; background-position: center;'">
        <div class="container">
            <h1>Contact Us</h1>
        </div>
    </section>

    <section>
        <div class="contact-grid">
            <div class="contact-sidebar">
                <h2>Contact Information</h2>
                <p style="margin-bottom: 30px; color: var(--text-muted);">Have questions about admissions or our
                    programs? Feel free to contact us.</p>

                <div class="contact-info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <div>
                        <h4>Address</h4>
                        <p>Goyla Dairy, New Delhi</p>
                    </div>
                </div>

                <div class="contact-info-item">
                    <i class="fas fa-phone"></i>
                    <div>
                        <h4>Phone</h4>
                        <p>+91 76783 77155</p>
                    </div>
                </div>

                <div class="contact-info-item">
                    <i class="fas fa-envelope"></i>
                    <div>
                        <h4>Email</h4>
                        <p>ipsmlittlewonders@gmail.com</p>
                    </div>
                </div>
            </div>

            <div class="contact-form">
                <div class="testimonial-card" style="padding: 40px; margin: 0;">
                    <h2>Admission Enquiry</h2>
                    <form id="contactForm" action="/submit-enquiry" method="POST" style="margin-top: 20px;">
                        <input type="hidden" name="relation" value="Not Specified">
                        <div class="form-group">
                            <label>Parent's Name</label>
                            <input type="text" name="parentName" placeholder="Enter your name" required>
                        </div>
                        <div class="form-group">
                            <label>Child's Name</label>
                            <input type="text" name="childName" placeholder="Enter child's name" required>
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" name="phone" placeholder="Enter your phone number" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" name="email" placeholder="Enter your email address" required>
                        </div>
                        <div class="form-group">
                            <label>Interested Program</label>
                            <select name="program">
                                <option value="Toddlers">Toddlers</option>
                                <option value="Pre-Nursery">Pre-Nursery</option>
                                <option value="Nursery">Nursery</option>
                                <option value="Prep">Prep</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea name="message" rows="4" placeholder="Your message here..."></textarea>
                        </div>
                        <button type="submit" class="btn-submit btn btn-primary" style="width: 100%;">Submit
                            Inquiry</button>
                        <div id="contactFormMessage" style="margin-top: 15px; text-align: center; display: none;"></div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <section style="padding: 0;">
        <div class="map-container" style="width: 100%; height: 450px;">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14013.914283577747!2d76.9922261!3d28.5855268!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390d106680a6886b%3A0xc3af779830da4232!2sGoyla%20Dairy%2C%20New%20Delhi%2C%20Delhi%20110071!5e0!3m2!1sen!2sin!4v1706522000000!5m2!1sen!2sin"
                width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
    </section>

    <footer th:replace="~{index :: footer}"></footer>


    <script th:src="@{/js/main.js}"></script>
    <script>
        // Handle contact form submission
        document.getElementById('contactForm')?.addEventListener('submit', function (e) {
            e.preventDefault();

            const formData = new FormData(this);
            const submitBtn = this.querySelector('.btn-submit');
            const messageDiv = document.getElementById('contactFormMessage');

            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            fetch('/submit-enquiry', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    messageDiv.style.display = 'block';
                    if (data.status === 'success') {
                        messageDiv.style.color = '#28a745';
                        messageDiv.textContent = data.message;
                        this.reset();

                        // Hide message after 5 seconds
                        setTimeout(() => {
                            messageDiv.style.display = 'none';
                        }, 5000);
                    } else {
                        messageDiv.style.color = '#dc3545';
                        messageDiv.textContent = data.message;
                    }
                })
                .catch(error => {
                    messageDiv.style.display = 'block';
                    messageDiv.style.color = '#dc3545';
                    messageDiv.textContent = 'An error occurred. Please try again.';
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Inquiry';
                });
        });
    </script>
</body>

</html>
