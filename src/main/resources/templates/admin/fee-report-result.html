<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Summary Report - IPSM Little Wonders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        .report-section {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.07);
            border: 1px solid #f1f1f1;
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #f8f9fa;
            padding-bottom: 15px;
            justify-content: space-between;
        }

        .section-header h2 {
            margin: 0;
            font-family: 'Fredoka One', cursive;
            font-size: 1.4rem;
            color: #333;
        }

        .badge-info {
            background: #e9ecef;
            color: #495057;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .table-responsive {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.03);
            border: 1px solid #f1f1f1;
        }

        .data-table th {
            background: #f8f9fa;
            padding: 15px 20px;
            font-weight: 700;
            color: #555;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-align: left;
            border-bottom: 2px solid #eee;
        }

        .data-table td {
            padding: 15px 20px;
            color: #444;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        .data-table tr:hover {
            background-color: #fdfdfd;
        }
        
        .btn-back {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        .btn-back:hover {
            background: #5a6268;
            color: white;
        }
    </style>
</head>

<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="top-bar">
            <div class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </div>
            <h1 style="font-family: 'Fredoka One', cursive;">Fee Report Results</h1>
        </div>

        <a th:href="@{/admin/fees/summary}" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Reports</a>

        <div class="report-section">
            <div class="section-header">
                <h2 th:text="${reportTitle}">Report Title</h2>
                <span class="badge-info" th:text="${courseName != null && !courseName.isEmpty() ? courseName : 'All Courses'}">Course</span>
            </div>
            
            <div th:if="${paidData.isEmpty()}" style="text-align: center; padding: 30px; color: #888;">
                <i class="fas fa-exclamation-circle" style="font-size: 3rem; margin-bottom: 15px; color: #ddd;"></i>
                <p>No records found for this selection.</p>
            </div>

            <div class="table-responsive" th:if="${!paidData.isEmpty()}">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Student Name</th>
                            <th>Course</th>
                            <th>Paid Amount (In Selection)</th>
                            <th>Total Pending Dues</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="entry : ${paidData}">
                            <td style="font-weight: 600; color: #2196F3;" th:text="${entry.key.username}">ID</td>
                            <td th:text="${entry.key.fullName}">Name</td>
                            <td th:text="${entry.key.course}">Course</td>
                            <td style="color: #4CAF50; font-weight: 700;" th:text="'₹ ' + ${entry.value}">Paid</td>
                            <td style="color: #F44336; font-weight: 700;" th:text="'₹ ' + ${entry.key.pendingFees != null ? entry.key.pendingFees : 0.0}">Pending</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
