<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Performance - IPSM Little Wonders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        /* Add performance specific styles */
        .form-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.04); max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-family: inherit; font-size: 15px; box-sizing: border-box; }
        .btn-submit { background: var(--admin-primary); color: white; border: none; padding: 12px 30px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; width: 100%; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="form-card">
            <h2 style="font-family: 'Fredoka One', cursive; color: var(--admin-primary); margin-top: 0; text-align: center;">Add Performance Report</h2>
            <p style="text-align: center; color: #777; margin-bottom: 30px;">Exam: <span th:text="${exam.title}">Exam Title</span> (<span th:text="${exam.session}">Session</span>)</p>
            
            <form th:action="@{/admin/performance/add}" method="post">
                <input type="hidden" name="examId" th:value="${exam.id}">
                
                <div class="form-group">
                    <label>Select Student</label>
                    <select name="studentId" required>
                        <option value="">Select a student</option>
                        <option th:each="student : ${students}" th:value="${student.id}" th:text="${student.fullName + ' (' + student.rollNumber + ')'}"></option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" name="subject" placeholder="e.g. Mathematics" required>
                    </div>
                    <div class="form-group">
                        <label>Grade/Result</label>
                        <input type="text" name="grade" placeholder="e.g. A+, Pass, Excellent">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Marks Obtained</label>
                        <input type="number" step="0.5" name="marksObtained" placeholder="e.g. 85" required>
                    </div>
                    <div class="form-group">
                        <label>Total Marks</label>
                        <input type="number" step="0.5" name="totalMarks" placeholder="e.g. 100" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Teacher's Remarks</label>
                    <textarea name="remarks" rows="3" placeholder="Enter feedback or remarks..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Save Performance Report</button>
            </form>
        </div>
    </div>
</body>
</html>
