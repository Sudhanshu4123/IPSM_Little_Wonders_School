<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Enquiries - IPSM Little Wonders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        /* Enquiry specific styles */
        .table-container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            color: #666;
            font-weight: 700;
            border-bottom: 2px solid #eee;
        }
        td {
            padding: 15px;
            border-bottom: 1px solid #f1f1f1;
            color: #444;
            vertical-align: top;
        }
        .btn-delete {
            background: #ff5252;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-delete:hover {
            background: #d32f2f;
        }
        .message-box {
            max-width: 300px;
            font-size: 0.9rem;
            color: #666;
            line-height: 1.4;
        }

    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="top-bar">
            <div class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </div>
            <h1 style="margin: 0; font-size: 1.3rem; color: #333;">Student Enquiries</h1>
            <div style="display: flex; align-items: center;">
                <i class="fas fa-user-circle" style="font-size: 1.2rem; margin-right: 8px;"></i>
                Admin
            </div>
        </div>

        <div class="table-container">
            <h2 style="font-family: 'Fredoka One', cursive; color: var(--admin-primary); margin-top: 0; font-size: 1.2rem;">Recent Enquiries</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Child Name</th>
                            <th>Parent Name</th>
                            <th>Program</th>
                            <th>Contact Info</th>
                            <th>Message</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="enquiry : ${enquiries}">
                            <td style="font-weight: 700;" th:text="${enquiry.childName}">Child Name</td>
                            <td th:text="${enquiry.parentName}">Parent Name</td>
                            <td>
                                <span style="background: #e1f5fe; color: #0288d1; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600;" th:text="${enquiry.program}">Program</span>
                            </td>
                            <td>
                                <div style="font-size: 0.9rem;"><i class="fas fa-phone" style="width: 15px;"></i> <span th:text="${enquiry.phone}">Phone</span></div>
                                <div style="font-size: 0.9rem; color: #666;"><i class="fas fa-envelope" style="width: 15px;"></i> <span th:text="${enquiry.email}">Email</span></div>
                            </td>
                            <td>
                                <div class="message-box" th:text="${enquiry.message}">Message</div>
                            </td>
                            <td style="font-size: 0.85rem; white-space: nowrap;" th:text="${#temporals.format(enquiry.createdAt, 'dd MMM yyyy, HH:mm')}">Date</td>
                            <td>
                                <form th:action="@{'/admin/enquiries/delete/' + ${enquiry.id}}" method="post">
                                    <button type="submit" class="btn-delete" onclick="return confirm('Are you sure you want to delete this enquiry?')">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(enquiries)}">
                            <td colspan="7" style="text-align: center; padding: 40px; color: #999;">No enquiries found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Use logic from fragment
    </script>
</body>
</html>
