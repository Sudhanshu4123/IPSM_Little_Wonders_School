<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Exams - IPSM Little Wonders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        /* Exam specific styles */
        .form-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.04); margin-bottom: 40px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-family: inherit; font-size: 15px; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: var(--admin-primary); }
        .btn-submit { background: var(--admin-primary); color: white; border: none; padding: 12px 30px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: transform 0.2s; }
        .btn-submit:hover { transform: scale(1.02); }
        .table-responsive { overflow-x: auto; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.04); }
        .item-table { width: 100%; border-collapse: collapse; background: white; }
        .item-table th { background: #f8f9fa; padding: 15px 20px; text-align: left; color: #666; font-weight: 700; }
        .item-table td { padding: 15px 20px; border-top: 1px solid #f1f1f1; color: #444; }
        .btn-delete { background: #ff5252; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; }
        .btn-results { background: var(--admin-secondary); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="top-bar">
            <h1>Manage Exams</h1>
        </div>

        <div class="form-card">
            <h2 style="font-family: 'Fredoka One', cursive; color: var(--admin-primary); margin-top: 0;">Add New Exam</h2>
            <form th:action="@{/admin/exams/add}" method="post">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Exam Title</label>
                        <input type="text" name="title" placeholder="e.g. Mid-Term Examination" required>
                    </div>
                    <div class="form-group">
                        <label>Exam Date</label>
                        <input type="date" name="examDate" required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Session</label>
                        <select name="session" required>
                            <option value="2024-25">2024-25</option>
                            <option value="2025-26">2025-26</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description" rows="1" placeholder="Optional description..."></textarea>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Add Exam</button>
            </form>
        </div>

        <h2 style="font-family: 'Fredoka One', cursive; color: #333;">Existing Exams</h2>
        <div class="table-responsive">
            <table class="item-table">
                <thead>
                    <tr>
                        <th>Exam Title</th>
                        <th>Exam Date</th>
                        <th>Session</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="exam : ${exams}">
                        <td style="font-weight: 700;" th:text="${exam.title}">Exam Name</td>
                        <td th:text="${exam.examDate}">Select Date</td>
                        <td th:text="${exam.session}">2024-25</td>
                        <td>
                            <a th:href="@{/admin/performance(examId=${exam.id})}" class="btn-results">Manage Results</a>
                            <form th:action="@{'/admin/exams/delete/' + ${exam.id}}" method="post" style="display: inline;">
                                <button type="submit" class="btn-delete" onclick="return confirm('Are you sure you want to delete this exam and all its results?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(exams)}">
                        <td colspan="4" style="text-align: center; padding: 40px; color: #999;">No exams added yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
