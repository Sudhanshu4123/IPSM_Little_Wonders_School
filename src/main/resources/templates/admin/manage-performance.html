<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Performance - IPSM Little Wonders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        /* Performance specific styles */
        .form-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.04); margin-bottom: 30px; }
        .btn-submit { background: var(--admin-primary); color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { transform: scale(1.02); }
        select { padding: 10px; border-radius: 8px; border: 2px solid #eee; font-family: inherit; font-size: 0.95rem; }
        .table-responsive { overflow-x: auto; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.04); }
        .item-table { width: 100%; border-collapse: collapse; background: white; }
        .item-table th { background: #f8f9fa; padding: 15px 20px; text-align: left; color: #666; font-weight: 700; border-bottom: 2px solid #eee; }
        .item-table td { padding: 15px 20px; border-bottom: 1px solid #f1f1f1; color: #444; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="top-bar">
            <h1>Performance Reports</h1>
        </div>

        <div class="form-card">
            <h2 style="font-family: 'Fredoka One', cursive; color: var(--admin-primary); margin-top: 0;">Select Exam</h2>
            <form th:action="@{/admin/performance}" method="get" style="display: flex; gap: 15px; align-items: center;">
                <select name="examId" required>
                    <option value="">Choose an exam</option>
                    <option th:each="exam : ${exams}" th:value="${exam.id}" th:text="${exam.title + ' (' + exam.session + ')'}" th:selected="${selectedExamId == exam.id}"></option>
                </select>
                <button type="submit" class="btn-submit" style="background: var(--admin-secondary);">Show Results</button>
            </form>
        </div>

        <div class="form-card" th:if="${selectedExamId != null}">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="font-family: 'Fredoka One', cursive; color: var(--admin-primary); margin: 0;">Results Management</h2>
                <a th:href="@{/admin/performance/add(examId=${selectedExamId})}" class="btn-submit" style="text-decoration: none; font-size: 0.9rem;">
                    <i class="fas fa-plus"></i> Add Student Result
                </a>
            </div>

            <div class="table-responsive">
                <table class="item-table">
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Student Name</th>
                            <th>Subject</th>
                            <th>Marks Obtained</th>
                            <th>Total Marks</th>
                            <th>Grade</th>
                            <th>Remarks</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="report : ${reports}">
                            <td th:text="${report.student.rollNumber}">Roll No</td>
                            <td th:text="${report.student.fullName}">Full Name</td>
                            <td th:text="${report.subject}">Subject</td>
                            <td th:text="${report.marksObtained}">Marks</td>
                            <td th:text="${report.totalMarks}">Total</td>
                            <td th:text="${report.grade}">Grade</td>
                            <td th:text="${report.remarks}">Remarks</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reports)}">
                            <td colspan="7" style="text-align: center; padding: 40px; color: #999;">No results found for this exam.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
