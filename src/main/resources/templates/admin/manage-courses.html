<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Courses - IPSM Little Wonders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        /* Course specific styles */
        .form-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            margin-bottom: 40px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--admin-primary);
        }
        .btn-submit {
            background: var(--admin-primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-submit:hover {
            transform: scale(1.02);
        }
        .table-responsive {
            overflow-x: auto;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
        }
        .item-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        .item-table th {
            background: #f8f9fa;
            padding: 15px 20px;
            text-align: left;
            color: #666;
            font-weight: 700;
        }
        .item-table td {
            padding: 15px 20px;
            border-top: 1px solid #f1f1f1;
            color: #444;
        }
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .status-active { background: #e8f5e9; color: #2e7d32; }


    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="top-bar">
            <div class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </div>
            <h1 style="margin: 0; font-size: 1.3rem; color: #333;">Manage Courses</h1>
            <div class="admin-user" style="display: flex; align-items: center;">
                <i class="fas fa-user-circle" style="font-size: 1.2rem; margin-right: 8px;"></i>
                Admin
            </div>
        </div>

        <div class="form-card">
            <h2 style="font-family: 'Fredoka One', cursive; color: var(--admin-primary); margin-top: 0; font-size: 1.2rem;">Add New Course</h2>
            <form th:action="@{/admin/courses/add}" method="post">
                <div class="form-group" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                    <div>
                        <label>Course Name</label>
                        <input type="text" name="name" placeholder="Enter course name" required>
                    </div>
                    <div>
                        <label>Duration</label>
                        <input type="text" name="duration" placeholder="Enter duration (e.g. 1 Year)" required>
                    </div>
                    <div>
                        <label>Standard Fee (₹)</label>
                        <input type="number" name="standardFee" placeholder="Enter standard fee" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" rows="3" placeholder="Course description..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Add Course</button>
            </form>
        </div>

        <h2 style="font-family: 'Fredoka One', cursive; color: #333; font-size: 1.2rem;">Available Programs</h2>
        <div class="table-responsive">
            <table class="item-table">
                <thead>
                    <tr>
                        <th>Course Name</th>
                        <th class="hide-mobile">Duration</th>
                        <th>Fee</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="course : ${courses}">
                        <td th:text="${course.name}">Course Name</td>
                        <td class="hide-mobile" th:text="${course.duration}">Duration</td>
                        <td th:text="${course.standardFee}">₹ 0.00</td>
                        <td>
                            <form th:action="@{'/admin/courses/delete/' + ${course.id}}" method="post">
                                <button type="submit" style="background: none; border: none; color: #ff5252; cursor: pointer; padding: 0;">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(courses)}">
                        <td colspan="4" style="text-align: center; color: #999;">No courses added yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Sidebar logic logic in fragment
    </script>
</body>
</html>
