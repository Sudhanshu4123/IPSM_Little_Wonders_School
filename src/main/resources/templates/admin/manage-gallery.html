<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Gallery - IPSM Little Wonders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        /* Gallery specific styles */
        .form-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            margin-bottom: 40px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--admin-primary);
        }
        .btn-submit {
            background: var(--admin-primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-submit:hover {
            transform: scale(1.02);
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .gallery-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            position: relative;
        }
        .gallery-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-info {
            padding: 15px;
        }
        .card-info h3 {
            margin: 0;
            font-size: 1rem;
            color: #333;
        }
        .category-badge {
            display: inline-block;
            padding: 4px 10px;
            background: #fff0f6;
            color: var(--admin-primary);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 8px;
        }
        .btn-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 82, 82, 0.9);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .btn-delete:hover {
            background: #ff5252;
            transform: scale(1.1);
        }


    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="top-bar">
            <div class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </div>
            <h1 style="margin: 0; font-size: 1.3rem; color: #333;">Manage Gallery</h1>
            <div style="display: flex; align-items: center;">
                <i class="fas fa-user-circle" style="font-size: 1.2rem; margin-right: 8px;"></i>
                Admin
            </div>
        </div>

        <div class="form-card">
            <h2 style="font-family: 'Fredoka One', cursive; color: var(--admin-primary); margin-top: 0; font-size: 1.2rem;">Add New Photo</h2>
            <form th:action="@{/admin/gallery/add}" method="post" enctype="multipart/form-data">
                <div class="form-group" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                    <div>
                        <label>Photo Title</label>
                        <input type="text" name="title" placeholder="Enter photo title" required>
                    </div>
                    <div>
                        <label>Category</label>
                        <select name="category" required>
                            <option value="Event">Events</option>
                            <option value="Facility">Facilities</option>
                            <option value="Classroom">Classrooms</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Upload Image</label>
                    <input type="file" name="imageFile" accept="image/*" required style="border: 2px dashed #ff4081; padding: 15px; background: #fff0f6;">
                </div>
                <button type="submit" class="btn-submit">Upload Photo</button>
            </form>
        </div>

        <h2 style="font-family: 'Fredoka One', cursive; color: #333; font-size: 1.2rem;">Gallery Collection</h2>
        <div class="gallery-grid">
            <div th:each="item : ${galleryItems}" class="gallery-card">
                <img th:src="@{${item.imageUrl}}" alt="Photo">
                <div class="card-info">
                    <h3 th:text="${item.title}">Photo Title</h3>
                    <span class="category-badge" th:text="${item.category}">Category</span>
                </div>
                <form th:action="@{'/admin/gallery/delete/' + ${item.id}}" method="post">
                    <button type="submit" class="btn-delete" title="Delete Photo">
                        <i class="fas fa-trash"></i>
                    </button>
                </form>
            </div>
            <div th:if="${#lists.isEmpty(galleryItems)}" style="grid-column: 1/-1; text-align: center; padding: 40px; color: #999;">
                No photos in the gallery yet.
            </div>
        </div>
    </div>

    <script>
        // Sidebar logic in fragment
    </script>
</body>
</html>
