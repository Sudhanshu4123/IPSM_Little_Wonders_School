<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Applications - IPSM Little Wonders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        /* Admissions specific styles */
        .table-responsive {
            overflow-x: auto;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
        }
        .item-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        .item-table th {
            background: #f8f9fa;
            padding: 15px 20px;
            text-align: left;
            color: #666;
            font-weight: 700;
        }
        .item-table td {
            padding: 15px 20px;
            border-top: 1px solid #f1f1f1;
            color: #444;
        }
        .btn-view {
            color: #00bcd4;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="top-bar">
            <div class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </div>
            <h1 style="margin: 0; font-size: 1.3rem; color: #333;">Manage Registration</h1>
            <div class="admin-user" style="display: flex; align-items: center;">
                <i class="fas fa-user-circle" style="font-size: 1.2rem; margin-right: 8px;"></i>
                Admin
            </div>
        </div>

        <div class="table-responsive">
            <table class="item-table">
                <thead>
                    <tr>
                        <th class="hide-mobile">ID</th>
                        <th>Student Name</th>
                        <th>Applied For</th>
                        <th>Session</th>
                        <th class="hide-mobile">Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="app : ${admissions}">
                        <td class="hide-mobile" th:text="${app.id}">0</td>
                        <td th:text="${app.firstName + ' ' + app.lastName}">Full Name</td>
                        <td th:text="${app.programApplied}">Toddler</td>
                        <td th:text="${app.session}">2024-25</td>
                        <td class="hide-mobile">
                            <span th:if="${app.admissionStatus == 'ADMITTED'}" style="color: #2e7d32; font-weight: 700; background: #e8f5e9; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem;">
                                <i class="fas fa-check-circle"></i> ADMITTED
                            </span>
                            <span th:unless="${app.admissionStatus == 'ADMITTED'}" style="color: #f57c00; font-weight: 700; background: #fff3e0; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem;">
                                <i class="fas fa-clock"></i> PENDING
                            </span>
                        </td>
                        <td style="display: flex; gap: 10px; align-items: center;">
                            <a th:href="@{'/admin/admissions/download/' + ${app.id}}" class="btn-view" title="Download Form" target="_blank" style="color: #4caf50;">
                                <i class="fas fa-file-download"></i> Form
                            </a>
                            <a href="#" class="btn-view" title="View Details"><i class="fas fa-eye"></i></a>
                            
                            <!-- Admit Button -->
                            <form th:if="${app.admissionStatus == 'PENDING'}" th:action="@{'/admin/admissions/admit/' + ${app.id}}" method="post" style="margin: 0;">
                                <button type="submit" style="background: var(--admin-secondary); color: white; border: none; padding: 6px 15px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.8rem;">
                                    Confirm Admission
                                </button>
                            </form>
                            
                            <span th:if="${app.admissionStatus == 'ADMITTED'}" style="color: #999; font-size: 0.8rem; font-style: italic;">
                                Student Account Created
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(admissions)}">
                        <td colspan="5" style="text-align: center; color: #999;">No applications yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Sidebar logic from fragment
    </script>
</body>
</html>
