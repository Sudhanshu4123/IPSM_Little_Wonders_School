<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Branches - IPSM Little Wonders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        .form-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.04); margin-bottom: 40px; }
        .form-group { margin-bottom: 20px; }
        /* and other branch specific styles ... */
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="top-bar">
            <div class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </div>
            <h1 style="margin: 0; font-size: 1.3rem; color: #333;">Manage Branches</h1>
            <div class="admin-user" style="display: flex; align-items: center;">
                <i class="fas fa-user-circle" style="font-size: 1.2rem; margin-right: 8px;"></i>
                Admin
            </div>
        </div>

        <div class="form-card">
            <h2 style="font-family: 'Fredoka One', cursive; color: var(--admin-primary); margin-top: 0; font-size: 1.2rem;">Add New Branch</h2>
            <form th:action="@{/admin/branches/add}" method="post" enctype="multipart/form-data">
                <div class="form-group" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                    <div>
                        <label>Branch Name</label>
                        <input type="text" name="name" placeholder="Enter branch name" required>
                    </div>
                    <div>
                        <label>Contact Number</label>
                        <input type="text" name="contactNumber" placeholder="Enter contact number" required>
                    </div>
                </div>
                <div class="form-group" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                    <div>
                        <label>Email Address</label>
                        <input type="email" name="email" placeholder="Enter email address" required>
                    </div>
                    <div>
                        <label>Branch Photo</label>
                        <input type="file" name="imageFile" accept="image/*" required style="border: 2px dashed #ff4081; padding: 10px; background: #fff0f6; width: 100%; box-sizing: border-box;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Full Address</label>
                    <input type="text" name="address" placeholder="Enter full address" required style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-family: inherit;">
                </div>
                <div class="form-group">
                    <label>Branch Description</label>
                    <textarea name="description" rows="3" placeholder="Briefly describe this branch (e.g. Spacious classrooms, main road access...)" required style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-family: inherit;"></textarea>
                </div>
                <div class="form-group">
                    <label>Google Maps Link (Optional)</label>
                    <input type="url" name="mapLink" placeholder="https://maps.google.com/..." style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-family: inherit;">
                </div>
                <button type="submit" class="btn-submit">Add Branch</button>
            </form>
        </div>

        <h2 style="font-family: 'Fredoka One', cursive; color: #333; font-size: 1.2rem;">Existing Branches</h2>
        <div style="overflow-x: auto;">
            <table class="branch-table" style="width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.04);">
                <thead>
                    <tr style="background: #f8f9ff; text-align: left;">
                        <th style="padding: 15px;">Logo/Photo</th>
                        <th style="padding: 15px;">Branch Name</th>
                        <th style="padding: 15px;">Contact</th>
                        <th style="padding: 15px;">Map</th>
                        <th style="padding: 15px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="branch : ${branches}" style="border-top: 1px solid #eee;">
                        <td style="padding: 15px;">
                            <img th:if="${branch.imagePath}" th:src="@{${branch.imagePath}}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                            <div th:unless="${branch.imagePath}" style="width: 60px; height: 60px; background: #eee; border-radius: 10px; display: flex; align-items: center; justify-content: center;"><i class="fas fa-school" style="color: #999;"></i></div>
                        </td>
                        <td style="padding: 15px;">
                            <div style="font-weight: 700; color: #333;" th:text="${branch.name}">Branch Name</div>
                            <div style="font-size: 0.8rem; color: #777;" th:text="${branch.address}">Address</div>
                        </td>
                        <td style="padding: 15px;" th:text="${branch.contactNumber}">Contact</td>
                        <td style="padding: 15px;">
                            <a th:if="${branch.mapLink}" th:href="${branch.mapLink}" target="_blank" style="color: var(--admin-secondary);"><i class="fas fa-map-marked-alt"></i> View</a>
                            <span th:unless="${branch.mapLink}" style="color: #ccc;">No Map</span>
                        </td>
                        <td style="padding: 15px;">
                            <form th:action="@{'/admin/branches/delete/' + ${branch.id}}" method="post">
                                <button type="submit" class="btn-delete" style="background: #ff5252; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: all 0.3s;">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(branches)}">
                        <td colspan="4" style="text-align: center; color: #999;">No branches added yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Specific scripts if any -->
</body>
</html>
