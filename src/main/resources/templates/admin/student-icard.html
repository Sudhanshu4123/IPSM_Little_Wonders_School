<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate I-Cards - IPSM Little Wonders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Fredoka+One&display=swap"
        rel="stylesheet">
    <style>
        .table-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.04);
            margin-bottom: 30px;
        }

        .alert-error {
            background: #fff5f5;
            color: #d32f2f;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #d32f2f;
        }
        
        .icard-form-container {
            display: grid;
            grid-template-columns: 200px 200px 200px;
            gap: 15px;
            align-items: end;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .icard-form-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="top-bar">
            <div class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </div>
            <h1 style="margin: 0; font-size: 1.3rem; color: #333;">I-Card Management</h1>
            <div style="display: flex; align-items: center; color: #666;">
                <i class="fas fa-user-circle" style="font-size: 1.5rem; margin-right: 10px;"></i>
                <span>Admin</span>
            </div>
        </div>

        <div th:if="${param.error}" class="alert-error">
            <i class="fas fa-exclamation-circle"></i> 
            <span th:text="${param.error}">Error message here</span>
        </div>

        <!-- Bulk I-Card Form -->
        <div class="table-card" style="border-left: 4px solid #4caf50;">
            <form th:action="@{/admin/students/icards/bulk}" method="get" target="_blank">
                <div class="icard-form-container">
                    <div class="form-group" style="margin:0;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem;">From Roll No.</label>
                        <select name="fromRoll" required
                            style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem;">
                            <option value="">Select From</option>
                            <option th:each="student : ${students}" th:value="${student.rollNumber}"
                                th:text="${student.rollNumber + ' - ' + student.fullName}"></option>
                        </select>
                    </div>
                    <div class="form-group" style="margin:0;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem;">To Roll No.</label>
                        <select name="toRoll" required
                            style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem;">
                            <option value="">Select To</option>
                            <option th:each="student : ${students}" th:value="${student.rollNumber}"
                                th:text="${student.rollNumber + ' - ' + student.fullName}"></option>
                        </select>
                    </div>
                    <button type="submit"
                        style="background: #4caf50; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; height: 38px;">
                        Generate I-Cards
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>

</html>
