<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Blogs - IPSM Little Wonders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        /* Blog specific styles */
        .form-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            margin-bottom: 40px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--admin-primary);
        }
        .btn-submit {
            background: var(--admin-primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-submit:hover {
            transform: scale(1.02);
        }
        .table-responsive {
            overflow-x: auto;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
        }
        .item-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        .item-table th {
            background: #f8f9fa;
            padding: 15px 20px;
            text-align: left;
            color: #666;
            font-weight: 700;
        }
        .item-table td {
            padding: 15px 20px;
            border-top: 1px solid #f1f1f1;
            color: #444;
        }
        .status-active { background: #e8f5e9; color: #2e7d32; }

        /* Published Blogs Table Styles */
        .blog-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin-top: 10px;
        }
        .blog-table th {
            padding: 15px;
            text-align: left;
            color: #666;
            font-weight: 700;
            border-bottom: 2px solid #f0f0f0;
        }
        .blog-table tr {
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }
        .blog-table tr:hover {
            transform: scale(1.002);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .blog-table td {
            padding: 15px;
            vertical-align: middle;
            border-top: 1px solid #f9f9f9;
        }
        .blog-table td:first-child { border-radius: 10px 0 0 10px; }
        .blog-table td:last-child { border-radius: 0 10px 10px 0; }

        .btn-delete {
            background: #fff0f0;
            color: #ff5252;
            border: 1px solid #ff5252;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-delete:hover {
            background: #ff5252;
            color: white;
        }
        .blog-thumb {
            width: 70px;
            height: 45px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #eee;
        }


    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="top-bar">
            <div class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </div>
            <h1 style="margin: 0; font-size: 1.3rem; color: #333;">Manage Blogs</h1>
            <div class="admin-user" style="display: flex; align-items: center;">
                <i class="fas fa-user-circle" style="font-size: 1.2rem; margin-right: 8px;"></i>
                Admin
            </div>
        </div>

        <div class="form-card">
            <h2 style="font-family: 'Fredoka One', cursive; color: var(--admin-primary); margin-top: 0; font-size: 1.2rem;">Create New Blog Post</h2>
            <form th:action="@{/admin/blogs/add}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Blog Title</label>
                    <input type="text" name="title" placeholder="Enter blog title" required>
                </div>
                <div class="form-group">
                    <label>Author Name</label>
                    <input type="text" name="authorName" placeholder="Enter author name" required>
                </div>
                <div class="form-group">
                    <label>Blog Content</label>
                    <textarea name="content" rows="6" placeholder="Write your blog content here..." required style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-family: inherit;"></textarea>
                </div>
                <div class="form-group">
                    <label>Blog Image</label>
                    <input type="file" name="imageFile" accept="image/*" required style="border: 2px dashed #ff4081; padding: 15px; background: #fff0f6; width: 100%; box-sizing: border-box;">
                </div>
                <button type="submit" class="btn-submit">Publish Blog</button>
            </form>
        </div>

        <h2 style="font-family: 'Fredoka One', cursive; color: #333; font-size: 1.2rem;">Published Blogs</h2>
        <div style="overflow-x: auto;">
            <table class="blog-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="blog : ${blogs}">
                        <td>
                            <img th:if="${blog.blogImagePath}" th:src="@{${blog.blogImagePath}}" class="blog-thumb" alt="Thumbnail">
                            <span th:unless="${blog.blogImagePath}" style="font-size: 0.8rem; color: #999;">No Image</span>
                        </td>
                        <td>
                            <div style="font-weight: 700; color: #333;" th:text="${blog.title}">Title</div>
                        </td>
                        <td th:text="${blog.authorName}">Author</td>
                        <td th:text="${#temporals.format(blog.publishedDate, 'dd MMM yyyy')}">Date</td>
                        <td>
                            <form th:action="@{'/admin/blogs/delete/' + ${blog.id}}" method="post" 
                                  onsubmit="return confirm('Are you sure you want to delete this blog post?')">
                                <button type="submit" class="btn-delete">
                                    <i class="fas fa-trash-alt"></i> Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(blogs)}">
                        <td colspan="5" style="text-align: center; color: #999;">No blogs published yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Fragment handles sidebar scripts
    </script>
</body>
</html>
