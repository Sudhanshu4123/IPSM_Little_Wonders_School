<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Summary - IPSM Little Wonders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Fredoka+One&display=swap"
        rel="stylesheet">
    <style>
        .report-section {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.07);
            border: 1px solid #f1f1f1;
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #f8f9fa;
            padding-bottom: 15px;
        }

        .section-header h2 {
            margin: 0;
            font-family: 'Fredoka One', cursive;
            font-size: 1.4rem;
            color: #333;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 700;
            color: #666;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .form-group select,
        .form-group input {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
            font-size: 0.9rem;
            color: #333;
        }

        .form-group select:focus {
            border-color: var(--admin-primary);
        }

        .btn-submit {
            background: #20c997;
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            align-self: flex-end;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(32, 201, 151, 0.3);
        }

        .badge-info {
            background: #e9ecef;
            color: #495057;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-left: 15px;
        }
    </style>
</head>

<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="top-bar">
            <div class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </div>
            <h1 style="font-family: 'Fredoka One', cursive;">Fee Summary & Reports</h1>
            <div
                style="display: flex; align-items: center; background: #f8f9fa; padding: 8px 15px; border-radius: 50px; border: 1px solid #eee;">
                <i class="fas fa-file-invoice"
                    style="font-size: 1.5rem; margin-right: 10px; color: var(--admin-primary);"></i>
                <span style="font-weight: 700; color: #444;">Report Generator</span>
            </div>
        </div>

        <!-- Section 1: Date Wise Fee Summary -->
        <div class="report-section">
            <div class="section-header">
                <h2>Date Wise Fee Summary</h2>
                <span class="badge-info">Daily/Range Report</span>
            </div>
            <form th:action="@{/admin/fees/summary/date}" method="get">
                <div class="filter-grid">

                    <div class="form-group">
                        <label>From Date *</label>
                        <input type="date" name="fromDate" required>
                    </div>
                    <div class="form-group">
                        <label>To Date *</label>
                        <input type="date" name="toDate" required>
                    </div>
                    <div class="form-group">
                        <label>Select Course</label>
                        <select name="courseName">
                            <option value="">-- All Courses --</option>
                            <option th:each="c : ${courses}" th:value="${c.name}" th:text="${c.name}"></option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end;">
                    <button type="submit" class="btn-submit"><i class="fas fa-calendar-alt"></i> Submit</button>
                </div>
            </form>
        </div>

        <!-- Section 2: Student Wise Fee Summary -->
        <div class="report-section">
            <div class="section-header">
                <h2>Student Wise Fee Summary</h2>
                <span class="badge-info">Individual Status & History</span>
            </div>
            <form th:action="@{/admin/fees/summary/student}" method="get">
                <div class="filter-grid">
                    <div class="form-group">
                        <label>Select Student *</label>
                        <select name="studentId" required>
                            <option value="">-- Choose Student --</option>
                            <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.fullName + ' (' + u.rollNumber + ')'}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Select Fee Type</label>
                        <select name="feeType">
                            <option value="">All Types</option>
                            <option value="Tution Fee">Tution Fee</option>
                            <option value="Admission Fee">Admission Fee</option>
                            <option value="Annual Fee">Annual Fee</option>
                            <option value="Registration Fee">Registration Fee</option>
                            <option value="Uniform Fee">Uniform Fee</option>
                            <option value="Books">Books</option>
                            <option value="Bag Fee">Bag Fee</option>
                            <option value="ID Card Fee">ID Card Fee</option>
                            <option value="Stationary Fee">Stationary Fee</option>
                            <option value="Festival & Birthday Celebration">Festival & Birthday Celebration</option>
                            <option value="Picnic & Extra Curricular Activities">Picnic & Extra Curricular Activities</option>
                            <option value="Yoga & Music & Dance">Yoga & Music & Dance</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Select Month</label>
                        <select name="month">
                            <option value="All">All Months</option>
                            <option value="January">January</option>
                            <option value="February">February</option>
                            <option value="March">March</option>
                            <option value="April">April</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August">August</option>
                            <option value="September">September</option>
                            <option value="October">October</option>
                            <option value="November">November</option>
                            <option value="December">December</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end;">
                    <button type="submit" class="btn-submit"><i class="fas fa-search"></i> Submit</button>
                </div>
            </form>
        </div>

        <!-- Section 3: Session Wise Fee Summary -->
        <div class="report-section">
            <div class="section-header">
                <h2>Session Wise Fee Summary</h2>
                <span class="badge-info">Full Batch Stats</span>
            </div>
            <form th:action="@{/admin/fees/summary/session}" method="get">
                <div class="filter-grid">

                    <div class="form-group">
                        <label>Select Session *</label>
                        <select name="session" required>
                            <option value="All">-- All Sessions --</option>
                            <option>2024-25</option>
                            <option>2025-26</option>
                            <option>2026-27</option>
                            <option>2027-28</option>
                            <option>2028-29</option>
                            <option>2029-30</option>
                            <option>2030-31</option>
                            <option>2031-32</option>
                            <option>2032-33</option>
                            <option>2033-34</option>
                            <option>2034-35</option>
                            <option>2035-36</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Select Course Type</label>
                        <select name="courseName">
                            <option value="">-- All Courses --</option>
                            <option th:each="c : ${courses}" th:value="${c.name}" th:text="${c.name}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Attending / Non-Attending</label>
                        <select>
                            <option>All</option>
                            <option>Attending</option>
                            <option>Non-Attending</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end;">
                    <button type="submit" class="btn-submit"><i class="fas fa-project-diagram"></i> Submit</button>
                </div>
            </form>
        </div>

        <!-- Section 4: Month Wise Fee Summary -->
        <div class="report-section">
            <div class="section-header">
                <h2>Month Wise Fee Summary</h2>
                <span class="badge-info">Monthly Collections</span>
            </div>
            <form th:action="@{/admin/fees/summary/month}" method="get">
                <div class="filter-grid">

                    <div class="form-group">
                        <label>Select Month *</label>
                        <select name="month" required>
                            <option value="All">-- All Months --</option>
                            <option value="January">January</option>
                            <option value="February">February</option>
                            <option value="March">March</option>
                            <option value="April">April</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August">August</option>
                            <option value="September">September</option>
                            <option value="October">October</option>
                            <option value="November">November</option>
                            <option value="December">December</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Select Year *</label>
                        <select name="year" required>
                            <option value="All">-- All Years --</option>
                            <option>2024</option>
                            <option>2025</option>
                            <option>2026</option>
                            <option>2027</option>
                            <option>2028</option>
                            <option>2029</option>
                            <option>2030</option>
                            <option>2031</option>
                            <option>2032</option>
                            <option>2033</option>
                            <option>2034</option>
                            <option>2035</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Select Course Type</label>
                        <select name="courseName">
                            <option value="">-- All Courses --</option>
                            <option th:each="c : ${courses}" th:value="${c.name}" th:text="${c.name}"></option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end;">
                    <button type="submit" class="btn-submit"><i class="fas fa-calendar-check"></i> Submit</button>
                </div>
            </form>
        </div>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>

</html>
