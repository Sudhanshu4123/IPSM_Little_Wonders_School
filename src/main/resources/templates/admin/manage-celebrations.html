<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Celebrations - IPSM Little Wonders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        /* Celebration specific styles */
        .form-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            margin-bottom: 40px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--admin-primary);
        }
        .btn-submit {
            background: var(--admin-primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-submit:hover {
            transform: scale(1.02);
        }
        .table-responsive {
            overflow-x: auto;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
        }
        .item-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        .item-table th {
            background: #f8f9fa;
            padding: 15px 20px;
            text-align: left;
            color: #666;
            font-weight: 700;
        }
        .item-table td {
            padding: 15px 20px;
            border-top: 1px solid #f1f1f1;
            color: #444;
        }


    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="top-bar">
            <div class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </div>
            <h1 style="margin: 0; font-size: 1.3rem; color: #333;">Manage Celebrations</h1>
            <div class="admin-user" style="display: flex; align-items: center;">
                <i class="fas fa-user-circle" style="font-size: 1.2rem; margin-right: 8px;"></i>
                <span class="admin-name-text">Admin</span>
            </div>
        </div>

        <div class="form-card">
            <h2 style="font-family: 'Fredoka One', cursive; color: var(--admin-primary); margin-top: 0; font-size: 1.2rem;">Add New Celebration</h2>
            <form th:action="@{/admin/celebrations/add}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Event Title</label>
                    <input type="text" name="title" placeholder="Enter event title (e.g. Independence Day)" required>
                </div>
                <div class="form-group" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                    <div>
                        <label>Event Date</label>
                        <input type="date" name="eventDate" required style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-family: inherit;">
                    </div>
                    <div>
                        <label>Event Photo</label>
                        <input type="file" name="imageFile" accept="image/*" required style="border: 2px dashed #ff4081; padding: 10px; background: #fff0f6; width: 100%; box-sizing: border-box;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Event Description</label>
                    <textarea name="description" rows="3" placeholder="Briefly describe the celebration..." required style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-family: inherit;"></textarea>
                </div>
                <button type="submit" class="btn-submit">Add Celebration</button>
            </form>
        </div>

        <h2 style="font-family: 'Fredoka One', cursive; color: #333; font-size: 1.2rem;">All Celebrations</h2>
        <div style="overflow-x: auto;">
            <table class="celebration-table" style="width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.04);">
                <thead>
                    <tr style="background: #f8f9ff; text-align: left;">
                        <th style="padding: 15px;">Photo</th>
                        <th style="padding: 15px;">Title</th>
                        <th style="padding: 15px;">Date</th>
                        <th style="padding: 15px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="event : ${celebrations}" style="border-top: 1px solid #eee;">
                        <td style="padding: 15px;">
                            <img th:if="${event.imagePath}" th:src="@{${event.imagePath}}" style="width: 80px; height: 50px; object-fit: cover; border-radius: 5px;">
                            <span th:unless="${event.imagePath}">No Image</span>
                        </td>
                        <td th:text="${event.title}" style="padding: 15px; font-weight: 700; color: #333;">Title</td>
                        <td th:text="${#temporals.format(event.eventDate, 'dd MMM yyyy')}" style="padding: 15px;">Date</td>
                        <td style="padding: 15px;">
                            <form th:action="@{'/admin/celebrations/delete/' + ${event.id}}" method="post">
                                <button type="submit" class="btn-delete" style="background: #ff5252; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer;">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(celebrations)}">
                        <td colspan="4" style="text-align: center; color: #999;">No celebrations added yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Sidebar logic in fragment
    </script>
</body>
</html>
