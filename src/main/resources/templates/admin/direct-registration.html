<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Student Enrollment - IPSM Little Wonders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Fredoka+One&display=swap"
        rel="stylesheet">
    <!-- Flatpickr for DOB -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        .form-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-heading {
            border-left: 5px solid var(--admin-primary);
            padding-left: 15px;
            margin: 30px 0 20px;
            color: #333;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            background: #fffafa;
            padding-top: 5px;
            padding-bottom: 5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: var(--admin-primary);
            outline: none;
        }

        .btn-submit {
            background: var(--admin-primary);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.2);
        }

        .success-msg {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="top-bar">
            <div class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </div>
            <h1 style="margin: 0; font-size: 1.3rem; color: #333;">Direct Registration</h1>
            <div style="display: flex; align-items: center; color: #666;">
                <i class="fas fa-user-circle" style="font-size: 1.5rem; margin-right: 10px;"></i>
                <span>Admin</span>
            </div>
        </div>

        <div th:if="${param.success}" class="success-msg">
            <i class="fas fa-check-circle"></i> student registered successfully with Roll Number.
        </div>

        <div class="form-card">
            <form th:action="@{/admin/students/register}" method="post" enctype="multipart/form-data">

                <h3 class="section-heading" style="margin-top: 0;"><i class="fas fa-baby"></i> Child Basic Info</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Admission Session *</label>
                        <select name="session" required>
                            <option value="2024-25">2024-25</option>
                            <option th:each="y : ${#numbers.sequence(25, 40)}" th:value="'20' + ${y} + '-' + (${y} + 1)"
                                th:text="'20' + ${y} + '-' + (${y} + 1)"></option>
                        </select>
                    </div>
                    <div th:replace="~{fragments/fee-elements :: courseSelect('Program Applied For *', '-- Select Program --', true, 'course')}"
                        id="courseSelect"></div>
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" name="fullName" placeholder="Child's Full Name" required>
                    </div>
                    <div class="form-group">
                        <label>Date of Birth *</label>
                        <input type="text" id="dob" name="dob" placeholder="Select DOB" required>
                    </div>
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="age" name="age" readonly style="background: #f5f5f5;">
                    </div>
                    <div class="form-group">
                        <label>Gender *</label>
                        <select name="gender" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Blood Group</label>
                        <select name="bloodGroup">
                            <option value="-">-</option>
                            <option value="A+">A+</option>
                            <option value="B+">B+</option>
                            <option value="O+">O+</option>
                            <option value="AB+">AB+</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Child Photo</label>
                        <input type="file" name="childPhoto" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label>Birth Certificate</label>
                        <input type="file" name="birthCertificate" accept=".pdf,image/*">
                    </div>
                </div>

                <h3 class="section-heading"><i class="fas fa-users"></i> Parents & Contact Info</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Father's Name *</label>
                        <input type="text" name="fatherName" required>
                    </div>
                    <div class="form-group">
                        <label>Mother's Name *</label>
                        <input type="text" name="motherName" required>
                    </div>
                    <div class="form-group">
                        <label>Father's Phone *</label>
                        <input type="tel" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label>Mother's Phone</label>
                        <input type="tel" name="motherPhone">
                    </div>
                    <div class="form-group">
                        <label>Email ID</label>
                        <input type="email" name="email">
                    </div>
                    <div class="form-group">
                        <label>Father's Occupation</label>
                        <input type="text" name="fatherOccupation">
                    </div>
                    <div class="form-group">
                        <label>Mother's Occupation</label>
                        <input type="text" name="motherOccupation">
                    </div>
                    <div class="form-group">
                        <label>Total Children</label>
                        <input type="number" name="totalChildren" min="1" value="1">
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Residential Address *</label>
                        <textarea name="address" rows="2" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Father's Photo</label>
                        <input type="file" name="fatherPhoto" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label>Mother's Photo</label>
                        <input type="file" name="motherPhoto" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label>Guardian's Photo</label>
                        <input type="file" name="guardianPhoto" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label>Aadhar Card (Parent)</label>
                        <input type="file" name="aadharCard" accept=".pdf,image/*">
                    </div>
                    <div class="form-group">
                        <label>PAN Card (Parent)</label>
                        <input type="file" name="panCard" accept=".pdf,image/*">
                    </div>
                </div>

                <h3 class="section-heading"><i class="fas fa-rupee-sign"></i> Fee Details</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Registration Fee</label>
                        <input type="number" name="registrationFee" th:value="${feeConfig.registrationFee}" readonly
                            style="background: #f5f5f5;">
                    </div>
                    <div class="form-group">
                        <label>Admission Fee</label>
                        <input type="number" name="admissionFee" th:value="${feeConfig.admissionFee}" readonly
                            style="background: #f5f5f5;">
                    </div>
                    <div class="form-group">
                        <label>Annual Fee</label>
                        <input type="number" name="annualFee" th:value="${feeConfig.annualFee}" readonly
                            style="background: #f5f5f5;">
                    </div>
                    <div class="form-group">
                        <label>Uniform Fee</label>
                        <input type="number" name="uniformFee" th:value="${feeConfig.uniformFee}" readonly
                            style="background: #f5f5f5;">
                    </div>
                    <div class="form-group">
                        <label>Books Fee</label>
                        <input type="number" name="booksFee" th:value="${feeConfig.booksFee}" readonly
                            style="background: #f5f5f5;">
                    </div>
                    <div class="form-group">
                        <label>Tuition Fee (Monthly)</label>
                        <input type="number" name="tuitionFee" id="tuitionFeeInput"
                            th:value="${feeConfig.getTuitionFee('Toddler')}" readonly style="background: #f5f5f5;">
                    </div>
                    <div class="form-group">
                        <label>Bag Fee</label>
                        <input type="number" name="bagFee" th:value="${feeConfig.bagFee}" readonly
                            style="background: #f5f5f5;">
                    </div>
                    <div class="form-group">
                        <label>ID Card Fee</label>
                        <input type="number" name="idCardFee" th:value="${feeConfig.idCardFee}" readonly
                            style="background: #f5f5f5;">
                    </div>
                    <div class="form-group">
                        <label>Stationary Fee</label>
                        <input type="number" name="stationaryFee" th:value="${feeConfig.stationaryFee}" readonly
                            style="background: #f5f5f5;">
                    </div>
                    <div class="form-group">
                        <label>Festival & Birthday Celebration</label>
                        <input type="number" name="celebrationFee" th:value="${feeConfig.celebrationFee}" readonly
                            style="background: #f5f5f5;">
                    </div>
                    <div class="form-group">
                        <label>Picnic & Extra Curricula Actvitives</label>
                        <input type="number" name="activityFee" th:value="${feeConfig.activityFee}" readonly
                            style="background: #f5f5f5;">
                    </div>
                    <div class="form-group">
                        <label>Yoga & Music & Dance</label>
                        <input type="number" name="yogaMusicDanceFee" th:value="${feeConfig.yogaMusicDanceFee}" readonly
                            style="background: #f5f5f5;">
                    </div>
                </div>

                <div style="background: #fff4f4; padding: 20px; border-radius: 12px; margin-top: 30px;">
                    <p style="margin:0; font-size: 0.85rem; color: #d32f2f;">
                        <strong>Note:</strong> Password will be digits of Date of Birth (e.g. 01012020).
                        Roll number will be auto-generated sequentially starting from 1001.
                    </p>
                </div>

                <button type="submit" class="btn-submit">Submit</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script th:inline="javascript">
        flatpickr("#dob", {
            dateFormat: "d-m-Y",
            maxDate: "today",
            onChange: function (selectedDates, dateStr) {
                if (selectedDates.length > 0) {
                    const birthDate = selectedDates[0];
                    const today = new Date();
                    let age = today.getFullYear() - birthDate.getFullYear();
                    const m = today.getMonth() - birthDate.getMonth();
                    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
                    document.getElementById('age').value = age;
                }
            }
        });

        // Dynamic tuition fee config drawn from backend
        const feeMap = {
            'Toddler': [[${ feeConfig.getTuitionFee('Toddler') }]],
            'Pre-Nursery': [[${ feeConfig.getTuitionFee('Pre-Nursery') }]],
            'Nursery': [[${ feeConfig.getTuitionFee('Nursery') }]],
            'Prep': [[${ feeConfig.getTuitionFee('Prep') }]]
        };

        const courseSelect = document.getElementById('courseSelect');
        const tuitionFeeInput = document.getElementById('tuitionFeeInput');

        courseSelect.addEventListener('change', function () {
            tuitionFeeInput.value = feeMap[this.value] || 2000;
        });
    </script>
</body>

</html>
